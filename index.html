
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Validation</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <form id="registerForm">

            <h2>Create Account</h2>
            <p>Fill in your information below.</p>

            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" placeholder="Your name">
                <small class="error" id="nameError"></small>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="text" id="email" placeholder="example@gmail.com">
                <small class="error" id="emailError"></small>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Minimum 8 characters">
                <small class="error" id="passwordError"></small>
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword" placeholder="Repeat password">
                <small class="error" id="confirmError"></small>
            </div>

             <div class="form-group">

        <label for="profileImage">Profile Image</label>

        <input
            type="file"
            id="profileImage"
            accept="image/png, image/jpeg, image/webp"
        >

        <small class="error" id="imageError"></small>

        <img
            id="imagePreview"
            src=""
            alt="Image preview"
            style="display: none; width: 120px; height: 120px; object-fit: cover; border-radius: 50%; margin-top: 10px;"
        >

    </div>

            <button type="submit">Register</button>

            <p id="successMessage"></p>

        </form>
    </div>

   
 

    <script src="script.js"></script>
</body>
</html>
